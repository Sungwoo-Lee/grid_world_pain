# Ablation Condition 7: Food + Danger (Full Environment)
# Dynamic resource switching, satiation + health
# All sensors except location

environment:
  max_steps: 200
  # Uses default prob_switch values
  eat_action_enabled: true
  rest_action_enabled: true

body:
  with_satiation: true
  with_health: true
  use_homeostatic_reward: false  # Not yet homeostatic

sensory:
  using_sensory: true
  nociception_enabled: true
  collision_sensor_enabled: true
  location_sensor: false
  proprioception_enabled: true
