# Level 08: Homeostatic Reward
# Focus: Motivation via internal state drive-reduction.
# Milestone: Drive-reduction reward enabled.
body:
  with_satiation: true
  with_health: true
  use_homeostatic_reward: true
  satiation_setpoint: 15.0

environment:
  max_steps: 500
  relocate_resource: true
  eat_action_enabled: true
  rest_action_enabled: true

sensory:
