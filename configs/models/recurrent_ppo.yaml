agent:
  algorithm: "RecurrentPPO"
  lr_actor: 0.0005
  lr_critic: 0.0001
  gamma: 0.95
  K_epochs: 4
  eps_clip: 0.1
  update_timestep: 2000
  sequence_length: 128     # Steps per rollout/sequence (shared by PyTorch & JAX)
  frame_stack: 1
  fc_layers: [128,128]
  recurrent_layers: [64]
  actor_fc_layers: [128,128]
  critic_fc_layers: [128,128]
  hidden_size: 64
  entropy_coef: 0.01
  gae_lambda: 0.95
  vf_coef: 0.5
  
  # Parity Options
  rnn_type: "LSTM"       # "LSTM" (PyTorch parity) or "GRU" (original JAX)
  activation: "tanh"     # "tanh" (PyTorch parity) or "relu" (original JAX)
  return_mode: "MC"      # "MC" (PyTorch parity) or "GAE" (original JAX)

  # Neuromodulation (§5 in NEUROMODULATION_ALGORITHM.md)
  # type: null disables modulation entirely (true baseline, §5.2)
  modulation:
    type: null
    mod_hidden_size: 64
    grouping_size: 1
    percept_bias_init: 2.0
    memory_bias_init: 0.0
    temp_clip: [0.1, 10.0]
