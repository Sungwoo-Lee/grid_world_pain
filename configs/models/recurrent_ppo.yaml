agent:
  algorithm: "RecurrentPPO"
  lr_actor: 0.0005
  lr_critic: 0.0001
  gamma: 0.95
  K_epochs: 4
  eps_clip: 0.1
  update_timestep: 2000
  sequence_length: 128     # Steps per rollout/sequence (shared by PyTorch & JAX)
  frame_stack: 1
  fc_layers: [128,128]
  recurrent_layers: [64]
  actor_fc_layers: [128,128]
  critic_fc_layers: [128,128]
  hidden_size: 64
  entropy_coef: 0.01
  gae_lambda: 0.95
  vf_coef: 0.5
  
  # Parity Options
  rnn_type: "GRU"       # "LSTM" (PyTorch parity) or "GRU" (original JAX)
  activation: "tanh"     # "tanh" (PyTorch parity) or "relu" (original JAX)
  return_mode: "MC"      # "MC" (PyTorch parity) or "GAE" (original JAX)

  # Encoding Configuration
  encoding_mode: "hierarchical"  # "flat" or "hierarchical"
  
  hierarchical_params:
    default_mlp: [64]
    unimodal_overrides:
      visual: [64]
    hub_overrides:
      body_state: [64]
      association: [128]

  # Neuromodulation: DISABLED (true baseline, §5.2)
  # For neuromodulated variant, use: configs/models/neuromodulated_ppo.yaml
  modulation:
    type: null
