# DreamerV3 — curriculum-with-levers + probe (E4 cell)
# ----------------------------------------------------------------------------
# Provenance: byte-identical copy of configs/models/dreamer_v3_curriculum.yaml
# with exactly ONE delta:
#
#     imagined_rollout_probe: false -> true
#
# All curriculum levers preserved verbatim from the parent config:
#   - entropy_scale: 1e-3       (parent's CURRICULUM-DELTA from 3e-4)
#   - cont_loss_weight: 5.0     (parent's CURRICULUM-DELTA from 1.0)
#
# Reproduces the just-finished `95mpudwp` run (3-stage curriculum + levers)
# bit-for-bit on the agent side, with the probe added so we can directly
# observe per-stage `imagined_termination_fraction`. The expectation is
# Stage 0/1 should show non-zero termination fraction (the curriculum's easy
# tasks have a tractable termination distribution; the diagnostic battery
# Cell B and the 95mpudwp Stage 0/1 unfreeze suggest learning is occurring),
# and Stage 2 (predator_full) regresses to ~0 within ~3,200 episodes of the
# stage transition — directly visualising the moment WM imagination loses
# death events. This is the structural mechanism inferred (but not directly
# observed) by the diagnostic battery's §11.4 cross-cell synthesis.
#
# References:
#   - Probe plan: docs/develop/active/diagnosis/dreamer_imagined_rollout_termination_probe.md
#   - Battery design doc: docs/experiments/active/continual_learning/DREAMER_PROBE_BATTERY.md
#   - Parent config (curriculum + levers): configs/models/dreamer_v3_curriculum.yaml
#   - Parent design doc: docs/experiments/active/continual_learning/DREAMER_CURRICULUM_FOOD_THEN_PREDATOR.md
#   - Diagnostic battery (where mechanism inference came from):
#     docs/experiments/active/continual_learning/DREAMER_DIAGNOSTIC_BATTERY.md (§11.4, §12.2)

agent:
  algorithm: "DreamerV3"
  batch_size: 16
  sequence_length: 128   # Steps per trajectory (same concept as Recurrent PPO sequence_length)
  replay_ratio: 0.5
  collect_interval: 128     # Env steps per iteration per env. 1 = sheeprl-style (canonical), 128 = full sequence (JAX-optimized)
  train_steps: 64
  model_lr: 1e-4
  actor_lr: 3e-5
  value_lr: 3e-5

  # Buffer Configuration
  buffer_device: "gpu"   # "gpu" (JAX array, zero-copy, fast) or "cpu" (numpy array, transfer overhead)
  buffer_capacity: 1000000

  # Mixture sampling (DreamerV4-inspired two-buffer architecture)
  # Set sampling_mode: "uniform" to disable (default backward-compatible behavior)
  sampling_mode: "mixture"                # "uniform" or "mixture"
  mixture_positive_slots: 5               # batch slots for positive-reward sequences
  mixture_recent_slots: 5                 # batch slots for recent sequences
  mixture_recent_window: 10000            # "recent" = last N transitions in main buffer
  positive_buffer_capacity: 100000        # dedicated positive-reward buffer (100K transitions = 16 MB)

  # Network Configuration (Comparative Alignment with Recurrent PPO)
  encoder_dim: 128
  encoder_fc_layers: [128, 128]

  rssm_deter_dim: 512
  rssm_stoch_dim: 32
  rssm_classes: 32

  decoder_fc_layers: [128, 128]

  reward_fc_layers: [128, 128]
  continue_fc_layers: [128, 128]

  actor_fc_layers: [128, 128]
  critic_fc_layers: [128, 128]

  entropy_scale: 1e-3      # CURRICULUM-DELTA vs dreamer_v3.yaml (3e-4 -> 1e-3, ~3.3x boost)
  cont_loss_weight: 5.0    # CURRICULUM-DELTA vs dreamer_v3.yaml (1.0 -> 5.0, 5x boost)
  imagined_rollout_probe: true  # PROBE-DELTA vs dreamer_v3_curriculum.yaml (false -> true).
  unimix: 0.01
  zero_init_reward_critic: true   # See dreamer_v3.yaml for full comment + doc links.
  paper_canonical_twohot_bins: true   # See dreamer_v3.yaml for full comment + doc links.
  apply_gru_reset_gate: true   # See dreamer_v3.yaml for full comment + doc links.
  use_layer_norm: true  # Orthogonal to modulation.type — applies LayerNorm to encoder pre-activations.
                         # Mirrors recurrent_ppo.yaml:20 / neuromodulated_ppo.yaml:20. Mandatory since commit f1db0f0.

  # Encoding Configuration
  encoding_mode: "hierarchical"  # "flat" or "hierarchical"

  hierarchical_params:
    # Unimodal Phase 1: Independent MLPs for each sensor
    # Available sensor names for overrides:
    # [Injury, Nutrition, Satiation, Extero Nociception, Olfaction, Collision, Proprioception, Visual, Location]
    default_mlp: [128,128]
    unimodal_overrides:
      visual: [128,128]
      olfaction: [128,128]
    multimodal_hub: [128,128]

  # Neuromodulation: DISABLED
  # For neuromodulated variant, use: configs/models/neuromodulated_dreamer_v3.yaml
  modulation:
    type: null
