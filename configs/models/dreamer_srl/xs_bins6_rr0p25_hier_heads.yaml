# dreamer-srl parity-track config — food-only NoPred 5x5
#
# Full sheeprl-XS hyperparameter set for parity-launch training runs.
# Extends agent_xs.yaml cadence keys with algo + model + optimizer keys.
#
# CP9b: learning_starts restored to 1024 (sheeprl XS default), reverting
#   the D-012 deviation used during CP9 smoke. §S3 random-action prefill
#   is now active; see CP9B_PLAN.md for implementation details.
#
# CORRECTION (2026-05-14, PI call docs/pi/calls/2026-05-14_d013_parity_launch_disposition.md):
#   Prior to this date, this file carried sheeprl-XL-equivalent values
#   (dense_units=1024, mlp_layers=5, recurrent_state_size=4096,
#   transition/representation hidden_size=1024) inlined from sheeprl's
#   BASE config dreamer_v3.yaml WITHOUT applying the dreamer_v3_XS.yaml
#   overlay. The mis-port produced the 14.38 GB JIT-compile OOM that
#   surfaced as D-013 at CP9. Per the PI disposition (user verbatim:
#   "Go with XS"), this file now mirrors the real sheeprl XS preset
#   (256 / 1 / 24 / 256 / 256). See CONFIG_CORRECTION_PLAN.md.
#
# Sheeprl references:
#   - Base config (XL-equivalent): vendor/sheeprl/sheeprl/configs/algo/dreamer_v3.yaml
#   - XS overlay (the values applied here): vendor/sheeprl/sheeprl/configs/algo/dreamer_v3_XS.yaml
#   - Experiment defaults: vendor/sheeprl/sheeprl/configs/exp/dreamer_v3.yaml

# Agent identity — mirrors configs/models/dreamer_v3/dreamer_v3_rr06.yaml:L40-L41
# Required for WandB filter: agent.algorithm = DreamerV3
agent:
  algorithm: "DreamerV3"

# Cadence (overrides agent_xs.yaml where needed)
algo:
  learning_starts: 1024
  replay_ratio: 0.25
  # bins-resolution experiment (SYNTHESIS_20260727): narrow the two-hot ruler ±20→±6.
  # At ±20 one bin ≈ 52 survival-steps and the task occupies ~10 of 255 bins; ±6 → ~16 steps/bin.
  # Code default (unset) = ±20 = sheeprl parity. Applies to critic + reward heads.
  twohot_low: -6.0
  twohot_high: 6.0
  per_rank_gradient_steps: 1
  per_rank_sequence_length: 64
  per_rank_batch_size: 16
  per_rank_pretrain_steps: 0
  total_steps: 5000            # smoke budget — kept for backward-compat; ignored when training.episodes is set

  # Core dreamer algorithm
  gamma: 0.996996996996997     # = 1 - 1/333; sheeprl dreamer_v3.yaml:L11
  lmbda: 0.95                  # sheeprl dreamer_v3.yaml:L23
  horizon: 15                  # sheeprl dreamer_v3.yaml:L24
  unimix: 0.01                 # sheeprl dreamer_v3.yaml:L25

  # KL balance
  kl_dynamic: 0.5              # sheeprl dreamer_v3.yaml:L29 (world_model.kl.dynamic)
  kl_representation: 0.1       # sheeprl dreamer_v3.yaml:L30 (world_model.kl.representation)
  kl_free_nats: 1.0            # sheeprl dreamer_v3.yaml:L31 (world_model.kl.free_nats)
  kl_regularizer: 1.0          # sheeprl dreamer_v3.yaml:L28 (world_model.kl.regularizer)
  continue_scale_factor: 1.0   # sheeprl dreamer_v3.yaml:L52

  # Obs keys (MLP-only — grid-world is vector obs, no CNN)
  cnn_keys:
    encoder: []
    decoder: []
  mlp_keys:
    encoder: ["obs"]
    decoder: ["obs"]

  # World model architecture
  world_model:
    # D-018 (hierarchical_modality_encoder_plan): design 2 — branched encoder, shared trunk + thin per-key decoder heads.
    # ONLY difference vs xs_bins6_rr0p25.yaml — everything else identical.
    encoding_mode: hierarchical
    hierarchical_params:
      mirror_encoder_in_decoder: false
      default_mlp: [256]          # per-modality branch hidden layers (rPPO XS recipe)
      multimodal_hub: [128, 128]  # fusion hub; reversed as the hub-mirror in design 3
      hidden_size: 256            # branch/hub output width = encoder output_dim
    encoder:
      dense_units: 256         # sheeprl algo/dreamer_v3_XS.yaml:L5 (XS overlay overrides base 1024 → 256)
      mlp_layers: 1            # sheeprl algo/dreamer_v3_XS.yaml:L6 (XS overlay overrides base 5 → 1)
      cnn_channels_multiplier: 24  # sheeprl algo/dreamer_v3_XS.yaml:L9 (XS overlay; no runtime effect — cnn_keys empty)
    decoder:
      dense_units: 256         # symmetric with encoder (sheeprl XS overlay)
      mlp_layers: 1
    recurrent_model:
      recurrent_state_size: 256    # sheeprl algo/dreamer_v3_XS.yaml:L11 (XS overlay overrides base 4096 → 256)
      dense_units: 256             # sheeprl algo/dreamer_v3_XS.yaml:L5 (XS overlay overrides base 1024 → 256)
    transition_model:
      hidden_size: 256         # sheeprl algo/dreamer_v3_XS.yaml:L13 (XS overlay overrides base 1024 → 256)
    representation_model:
      hidden_size: 256         # sheeprl algo/dreamer_v3_XS.yaml:L15 (XS overlay overrides base 1024 → 256)
    reward_model:
      dense_units: 256         # sheeprl algo/dreamer_v3_XS.yaml:L5 (XS overlay; inherits algo.dense_units)
      mlp_layers: 1            # sheeprl algo/dreamer_v3_XS.yaml:L6 (XS overlay; inherits algo.mlp_layers)
      bins: 255                # sheeprl dreamer_v3.yaml:L36 (reward_model.bins; NOT overridden by XS)
    continue_model:
      dense_units: 256         # sheeprl algo/dreamer_v3_XS.yaml:L5 (XS overlay; inherits algo.dense_units)
      mlp_layers: 1            # sheeprl algo/dreamer_v3_XS.yaml:L6 (XS overlay; inherits algo.mlp_layers)
    stochastic_size: 32        # num_categoricals (S); sheeprl exp/dreamer_v3.yaml:L23
    discrete_size: 32          # num_classes per categorical (D); sheeprl exp/dreamer_v3.yaml:L24
    optimizer:
      lr: 1.0e-4               # sheeprl dreamer_v3.yaml:L14
      eps: 1.0e-8              # sheeprl dreamer_v3.yaml:L15

  # Actor architecture + optimizer
  actor:
    dense_units: 256           # sheeprl algo/dreamer_v3_XS.yaml:L5 (XS overlay; inherits algo.dense_units)
    mlp_layers: 1              # sheeprl algo/dreamer_v3_XS.yaml:L6 (XS overlay; inherits algo.mlp_layers)
    ent_coef: 3.0e-4           # sheeprl dreamer_v3.yaml:L63
    moments:
      decay: 0.99              # sheeprl dreamer_v3.yaml:L68 (actor.moments.decay)
      max: 1.0                 # sheeprl dreamer_v3.yaml:L69 (actor.moments.max)
      percentile:
        low: 0.05              # sheeprl dreamer_v3.yaml:L71
        high: 0.95             # sheeprl dreamer_v3.yaml:L72
    optimizer:
      lr: 8.0e-5               # sheeprl dreamer_v3.yaml:L57
      eps: 1.0e-5              # sheeprl dreamer_v3.yaml:L58

  # Critic architecture + optimizer
  critic:
    dense_units: 256           # sheeprl algo/dreamer_v3_XS.yaml:L5 (XS overlay; inherits algo.dense_units)
    mlp_layers: 1              # sheeprl algo/dreamer_v3_XS.yaml:L6 (XS overlay; inherits algo.mlp_layers)
    bins: 255                  # sheeprl dreamer_v3.yaml:L82
    tau: 0.02                  # sheeprl dreamer_v3.yaml:L77
    per_rank_target_network_update_freq: 1  # sheeprl dreamer_v3.yaml:L151
    optimizer:
      lr: 8.0e-5               # sheeprl dreamer_v3.yaml:L75
      eps: 1.0e-5              # sheeprl dreamer_v3.yaml:L76

# Buffer
buffer:
  size: 1000000
  validate_args: false
  from_numpy: false

# Episode-based budget cap — mirrors rPPO production (10M episodes).
# This is a CAP, not a target — actual runs may be Ctrl-C'd much earlier.
# Reference: train_command-agent.sh:86-97 (rPPO Round 2.6 launch uses 10M).
# R2 mitigation: checkpoint_frequency raised from 10k → 200k so eval fires
# ~50 times over a 10M-episode run (vs. 1000 fires at 10k = ~7h overhead).
training:
  episodes: 10000000
  checkpoint_frequency: 200000
  # Log cadence anchored to ROWS-PER-SESSION, not env-steps-per-row.
  # rPPO production accumulates ~10M episodes in 24h → ~2500 WandB rows
  # at log_interval=50. Dreamer-srl @ ~38 SPS / num_envs=16 only reaches
  # ~20-40k episodes in 24h (250-500× less). Matching rPPO's env-step cadence
  # (log_interval=50000 ≈ 800k env-steps/log) gave only ~4-6 rows per session
  # — empirically useless (see 2026-05-28 oxm78on8 / 50cpronf / 2r5hc0oz / hbqje3dt).
  # log_interval=2000 yields ~160 episodes/row (≈ 0.08 ep/iter × 2000 iters)
  # and ~140 rows in a 22k-episode session — same trajectory-shape resolution
  # rPPO has at production scale.
  # Read priority: --log-interval CLI > this key > env_cfg default (10).
  log_interval: 2000

# Env
env:
  num_envs: 1                  # XS default (sheeprl env/default.yaml:L1)
