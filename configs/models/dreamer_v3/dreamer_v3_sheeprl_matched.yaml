# DreamerV3 — sheeprl-XS matched-config variant
# ----------------------------------------------------------------------------
# Purpose: Measure JAX-side training throughput (env-SPS and grad-update-SPS)
# under a hyperparameter recipe that mirrors the sheeprl PyTorch XS preset,
# so the SPS comparison in
#   docs/experiments/active/sheeprl_bridge/SPS_COMPARISON_JAX_VS_SHEEPRL.md
# can be re-run apples-to-apples.
#
# Design doc:
#   docs/experiments/active/sheeprl_bridge/JAX_SHEEPRL_MATCHED_SPS_DESIGN.md
#
# Provenance: byte-identical copy of configs/models/dreamer_v3/dreamer_v3.yaml with the
# following deltas (each mirrors the sheeprl XS recipe at the corresponding
# row of §2 of the SPS-comparison memo):
#
#   recurrent_state_size: 512 -> 256       (rssm_deter_dim)
#   dense_units:          128 -> 256       (encoder_fc_layers, MLP-head sizes)
#   mlp_layers:           2   -> 1         (1-layer-deep MLPs instead of 2)
#   sequence_length:      128 -> 64
#   encoding_mode: hierarchical -> flat    (sheeprl uses a flat MLP encoder)
#
# Plus one delta against the cascade-side Hafner-Atari replay_ratio baseline
# (configs/models/dreamer_v3/dreamer_v3_rr06.yaml, NOT dreamer_v3.yaml which sits at 0.5):
#
#   replay_ratio:         0.0625 -> 1.0    (16x more grad updates per env step)
#
# Unchanged (matched-or-acceptable):
#   batch_size:           16                (already matched to sheeprl)
#   collect_interval:     128               (JAX-loop structure; not a sheeprl knob.
#                                            Per-env grad/env ratio is what matters;
#                                            replay_ratio=1 enforces it.)
#   train_steps:          64                (effective grad-updates-per-iteration is
#                                            scaled by Ratio(replay_ratio) at runtime;
#                                            see train.py:793, 1767)
#   buffer_device:        gpu               (architectural advantage; not a sheeprl knob)
#   sampling_mode:        mixture           (we keep the JAX-side improvement; the
#                                            sheeprl XS run also uses prioritized
#                                            sampling so the comparison stays fair)
#   model_lr, actor_lr, value_lr            (sheeprl uses Hafner defaults too)
#
# Why a separate file: the original dreamer_v3.yaml is tied to the
# hypervigilance cascade experiments (Z1/Z2/Z3 runs). Modifying it would
# silently change SPS for unrelated downstream runs. This sibling file is
# read-only-on-original.
#
# Related files:
#   - SPS audit table:
#     docs/experiments/active/sheeprl_bridge/SPS_COMPARISON_JAX_VS_SHEEPRL.md §2
#   - Sheeprl bridge implementation plan:
#     docs/develop/active/sheeprl_bridge/IMPLEMENTATION_PLAN.md
#   - JAX vector-env v2 GPU spike (the rebuild this experiment gates):
#     docs/develop/active/sheeprl_bridge/JAX_VECTOR_ENV_V2_GPU_SPIKE.md

agent:
  algorithm: "DreamerV3"
  batch_size: 16
  sequence_length: 64        # OVERRIDE vs dreamer_v3.yaml (128 -> 64). Mirrors sheeprl per_rank_sequence_length=64.
  replay_ratio: 1.0          # OVERRIDE vs dreamer_v3_rr06.yaml (0.0625 -> 1.0). The 0.0625 baseline is the
                             # Hafner-2023 Atari/DMC default that the cascade-side runs use; dreamer_v3.yaml
                             # itself sits at 0.5. Mirrors sheeprl replay_ratio=1 (1 grad update per env step per env).
  collect_interval: 128      # Unchanged. JAX-loop scan length; the effective per-env grad/env ratio
                             # is governed by replay_ratio above.
  train_steps: 64            # Unchanged. Effective per-iter grad updates = Ratio(replay_ratio)(global_step / collect_interval).
  model_lr: 1e-4
  actor_lr: 3e-5
  value_lr: 3e-5

  # Buffer Configuration
  buffer_device: "gpu"
  buffer_capacity: 1000000

  # Mixture sampling (kept; sheeprl uses prioritized sampling on its side)
  sampling_mode: "mixture"
  mixture_positive_slots: 5
  mixture_recent_slots: 5
  mixture_recent_window: 10000
  positive_buffer_capacity: 100000

  # Network Configuration — sheeprl-XS matched
  # dense_units=256, mlp_layers=1 means every MLP head is [256] (1 hidden layer of width 256).
  encoder_dim: 256                       # OVERRIDE vs 128. Matches sheeprl dense_units=256.
  encoder_fc_layers: [256]               # OVERRIDE vs [128, 128]. Matches sheeprl mlp_layers=1, dense_units=256.

  rssm_deter_dim: 256                    # OVERRIDE vs 512. Matches sheeprl recurrent_state_size=256.
  rssm_stoch_dim: 32                     # Unchanged (sheeprl stochastic_size=32).
  rssm_classes: 32                       # Unchanged (sheeprl classes=32).

  decoder_fc_layers: [256]               # OVERRIDE vs [128, 128]. Matches sheeprl mlp_layers=1, dense_units=256.

  reward_fc_layers: [256]                # OVERRIDE vs [128, 128]. Same as above.
  continue_fc_layers: [256]              # OVERRIDE vs [128, 128]. Same as above.

  actor_fc_layers: [256]                 # OVERRIDE vs [128, 128]. Same as above.
  critic_fc_layers: [256]                # OVERRIDE vs [128, 128]. Same as above.

  entropy_scale: 3e-4
  cont_loss_weight: 1.0
  imagined_rollout_probe: false
  unimix: 0.01
  zero_init_reward_critic: true
  paper_canonical_twohot_bins: true
  apply_gru_reset_gate: true
  use_layer_norm: true

  # Encoding Configuration — sheeprl matches a flat encoder, not hierarchical.
  encoding_mode: "flat"                  # OVERRIDE vs "hierarchical". Mirrors sheeprl flat-MLP encoder.

  # hierarchical_params block kept for schema completeness even though
  # encoding_mode=flat means the trainer (src/models/dreamer_v3_trainer.py:82)
  # passes this through as {} to the encoder, which then routes to the
  # flat branch at src/models/dreamer_v3_nnx.py:268-270.
  hierarchical_params:
    default_mlp: [256]
    unimodal_overrides:
      visual: [256]
      olfaction: [256]
    multimodal_hub: [256]

  # Neuromodulation: DISABLED (sheeprl-XS has no modulator)
  modulation:
    type: null
