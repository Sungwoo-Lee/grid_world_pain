# recurrent_ppo_cmp_gaenorm — the fourth arm of the return-estimator / scale comparison.
# ---------------------------------------------------------------------------
# PLAIN LANGUAGE: recurrent PPO learns two numbers from each rollout — a *critic target*
# (what total future reward the value head should have predicted) and an *advantage*
# (how much better an action turned out than the critic expected). Two independent
# choices go into producing that pair: WHICH ESTIMATOR builds it (Monte-Carlo returns, or
# generalised advantage estimation "GAE"), and HOW the two numbers are RESCALED before
# training. Those two choices make a 2x2, and until this config only three of the four
# cells existed:
#   recurrent_ppo_cmp_mc.yaml       "MC"        Monte-Carlo estimator, MATCHED scale:
#                                   the target is rescaled to mean 0 / spread 1 and the
#                                   advantage is the left-alone difference target - critic.
#   recurrent_ppo_cmp_mcfixed.yaml  "MC_FIXED"  Monte-Carlo estimator, SPLIT scale:
#                                   raw target (spread ~24), separately rescaled advantages.
#   recurrent_ppo_cmp_gae.yaml      "GAE"       GAE estimator, SPLIT scale.
#   recurrent_ppo_cmp_gaenorm.yaml  "GAE_NORM"  GAE estimator, MATCHED scale.  <-- THIS FILE
#
# WHY THE MISSING CELL MATTERS: on the 10x10 jump-attack environment (basic/04), one
# million episodes, five random seeds per arm, the agents survived on average 138.8 steps
# under "MC" but only 40.0 under "MC_FIXED" and 41.9 under "GAE" — the two textbook-
# convention arms are ~3.5x worse and never once reach the 500-step episode cap. The
# hypothesis under test is that what helps "MC" is not its estimator but its MATCHED
# scale: critic and policy learn on the same units, whereas the other two train the critic
# on numbers ~24x larger than the ones the policy sees. If scale is the cause, this arm
# (GAE estimator, matched scale) should behave like MC; if the estimator is the cause, it
# should behave like GAE.
#
# Identical to recurrent_ppo.yaml in every other hyperparameter, and neuromodulation is OFF
# (modulation.type: null) — any modulator would be a confound in an estimator comparison.
# Survey: docs/project/references/modulation_in_rl/ppo_return_normalization_survey.md
# Units-mismatch diagnosis behind MC_FIXED:
#   docs/develop/active/issues/FIX_MC_RETURN_UNITS_AND_LEARNING_RATES.md (Fix 1)
# ---------------------------------------------------------------------------
agent:
  algorithm: "RecurrentPPO"
  lr_actor: 0.0005
  lr_critic: 0.0001
  gamma: 0.95
  K_epochs: 4
  eps_clip: 0.1
  # update_timestep: 2000
  sequence_length: 128     # Steps per rollout/sequence
  frame_stack: 1
  fc_layers: [128,128]
  # recurrent_layers: [128]
  actor_fc_layers: [128,128]
  critic_fc_layers: [128,128]
  hidden_size: 128
  entropy_coef: 0.01
  gae_lambda: 0.95
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_layer_norm: true
  
  # Parity Options
  rnn_type: "GRU"       # "LSTM" or "GRU"
  activation: "relu"     # "tanh" or "relu"
  return_mode: "GAE_NORM"       # GAE(lambda) estimator, z-scored target, un-rescaled advantages

  # Encoding Configuration
  encoding_mode: "hierarchical"  # "flat" or "hierarchical"
  
  hierarchical_params:
    # Unimodal Phase 1: Independent MLPs for each sensor
    # Available sensor names for overrides: 
    # [Injury, Nutrition, Satiation, Extero Nociception, Olfaction, Collision, Proprioception, Visual, Location]
    default_mlp: [128,128]
    unimodal_overrides:
      visual: [128,128]
      olfaction: [128,128]
    
    # Multimodal Phase 2: Fusion hub
    multimodal_hub: [128,128]

  # Neuromodulation: DISABLED (true baseline, §5.2)
  # For neuromodulated variant, use: configs/models/ppo/neuromodulated_ppo.yaml
  modulation:
    type: null
