agent:
  algorithm: "RecurrentPPO"
  lr_actor: 0.0005
  lr_critic: 0.0001
  gamma: 0.95
  K_epochs: 4
  eps_clip: 0.1
  # update_timestep: 2000
  sequence_length: 128     # Steps per rollout/sequence (shared by PyTorch & JAX)
  frame_stack: 1
  fc_layers: [128,128]
  # recurrent_layers: [64]
  actor_fc_layers: [128,128]
  critic_fc_layers: [128,128]
  hidden_size: 128
  entropy_coef: 0.01
  gae_lambda: 0.95
  vf_coef: 0.5
  max_grad_norm: 0.5

  # Parity Options
  # GRU is required for gate-bias injection (§5.1a) — LSTM gate-bias not yet supported
  rnn_type: "GRU"          # GRU required for full modulation support
  activation: "tanh"       # "tanh" (PyTorch parity) or "relu" (original JAX)
  return_mode: "GAE"        # "MC" (PyTorch parity) or "GAE" (original JAX)

  # Encoding Configuration
  encoding_mode: "hierarchical"  # "flat" or "hierarchical"
  
  hierarchical_params:
    # Unimodal Phase 1: Independent MLPs for each sensor
    # Available sensor names for overrides: 
    # [Injury, Nutrition, Satiation, Extero Nociception, Olfaction, Collision, Proprioception, Visual, Location]
    default_mlp: [128,128]
    unimodal_overrides:
      visual: [128,128]
    
    # Multimodal Phase 2: Fusion hub
    multimodal_hub: [128,128]

  # Neuromodulation (§5 in NEUROMODULATION_ALGORITHM.md)
  # Bi-Recurrent Modulator: NeuromodulatorRNN + ModulatedGRUCell
  #
  # Perceptual modulation types (Injection A):
  #   "Multiplicative"  — Post-activation gating (Ben-Iwhiwhu style)
  #                        h = relu(Wx + b) * sigmoid(z_percept)
  #   "PreActivation"   — Pre-activation gain + threshold shift (Ferguson & Cardin style)
  #                        h = relu(gamma(z_percept) * (Wx + b) + beta(z_percept_add))
  #                        gamma = multiplicative neural gain (Shine et al.)
  #                        beta  = additive threshold shift (Ferguson disinhibition)
  #   null              — Disabled (true baseline, no modulator constructed)
  modulation:
    type: "Multiplicative"       # "Multiplicative", "PreActivation", or null
    mod_hidden_size: 64          # GRU hidden units for modulator
    grouping_size: 40             # Spatial grouping G (1 = per-neuron, §12)
    percept_bias_init: 2.0       # Gain head (gamma) bias init (§5.2: sigmoid(2.0)≈0.88)
    percept_add_bias_init: 0.0   # Threshold-shift head (beta) bias init (PreActivation only)
    memory_bias_init: 0.0        # Memory gate-bias init (§5.1a: neutral)
    temp_clip: [0.1, 10.0]       # Temperature bounds (§5.3a: prevent collapse)
