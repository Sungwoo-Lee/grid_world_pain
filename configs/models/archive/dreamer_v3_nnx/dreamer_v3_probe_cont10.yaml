# DreamerV3 — probe-enabled + cont_loss_weight=10 variant (E2 cell)
# ----------------------------------------------------------------------------
# Provenance: copy of configs/models/dreamer_v3/dreamer_v3.yaml with TWO deltas:
#
#     cont_loss_weight: 1.0  -> 10.0
#     imagined_rollout_probe: false -> true
#
# Tests diagnosis §7.3 priority-2 fix: if the WM continuation head is
# exploiting class imbalance (98.4% acc ≈ trivial 96.3% baseline + 2 pp), then
# scaling its loss weight by 10× should force the head to actually learn
# death events, raising the imagined-termination fraction toward the real
# termination rate. Pairs with the probe to make the mechanism directly
# observable. The curriculum-with-levers run used 5×; this is the diagnosis's
# original 10× recommendation, applied without curriculum so the result is
# attributable to the cont-weight knob alone (no curriculum confound).
#
# All other Hafner-2023 defaults preserved (entropy_scale=3e-4, lr triple,
# mixture sampling, hierarchical encoder, rssm 512/32x32).
#
# References:
#   - Probe plan: docs/develop/active/diagnosis/dreamer_imagined_rollout_termination_probe.md
#   - Battery design doc: docs/experiments/active/continual_learning/DREAMER_PROBE_BATTERY.md
#   - cont_loss_weight knob: docs/develop/active/diagnosis/dreamer_cont_loss_weight_knob.md
#   - Diagnosis: docs/develop/active/diagnosis/dreamer_hypervigilance_learning_failure.md (§7.3 priority 2)

agent:
  algorithm: "DreamerV3"
  batch_size: 16
  sequence_length: 128   # Steps per trajectory (same concept as Recurrent PPO sequence_length)
  replay_ratio: 0.00390625   # WP-NNX U4/F7: semantics changed to per-ENV-STEP (sheeprl); value rescaled ÷128 (0.5 -> 0.00390625) to preserve prior effective training intensity.
  learning_starts: 1024      # WP-NNX U4/F7: random-action prefill (env steps) before training starts. sheeprl default. MANDATORY key (get_mandatory) — missing key crashes training.
  collect_interval: 128     # Env steps collected per iteration per env (JAX scan length). Training intensity is governed by replay_ratio (per-env-step), NOT this knob. (K5: old "1 = sheeprl-style (canonical)" note was misleading.)
  train_steps: 64
  model_lr: 1e-4
  actor_lr: 3e-5
  value_lr: 3e-5

  # Buffer Configuration
  buffer_device: "gpu"   # "gpu" (JAX array, zero-copy, fast) or "cpu" (numpy array, transfer overhead)
  buffer_capacity: 1000000

  # Mixture sampling (DreamerV4-inspired two-buffer architecture)
  # Set sampling_mode: "uniform" to disable (default backward-compatible behavior)
  sampling_mode: "mixture"                # "uniform" or "mixture"
  mixture_positive_slots: 5               # batch slots for positive-reward sequences
  mixture_recent_slots: 5                 # batch slots for recent sequences
  mixture_recent_window: 10000            # "recent" = last N transitions in main buffer
  positive_buffer_capacity: 100000        # dedicated positive-reward buffer (100K transitions = 16 MB)

  # Network Configuration (Comparative Alignment with Recurrent PPO)
  encoder_dim: 128
  encoder_fc_layers: [128, 128]

  rssm_deter_dim: 512
  rssm_stoch_dim: 32
  rssm_classes: 32

  decoder_fc_layers: [128, 128]

  reward_fc_layers: [128, 128]
  continue_fc_layers: [128, 128]

  actor_fc_layers: [128, 128]
  critic_fc_layers: [128, 128]

  entropy_scale: 3e-4       # Hafner 2023 standard value (unchanged vs dreamer_v3.yaml)
  cont_loss_weight: 10.0    # E2-DELTA vs dreamer_v3.yaml (1.0 -> 10.0, 10x boost; diagnosis §7.3 priority-2 recommendation).
  imagined_rollout_probe: true  # PROBE-DELTA vs dreamer_v3.yaml (false -> true).
  unimix: 0.01
  zero_init_reward_critic: true   # See dreamer_v3.yaml for full comment + doc links.
  paper_canonical_twohot_bins: true   # See dreamer_v3.yaml for full comment + doc links.
  apply_gru_reset_gate: true   # See dreamer_v3.yaml for full comment + doc links.
  use_layer_norm: true  # Orthogonal to modulation.type — applies LayerNorm to encoder pre-activations.
                         # Mirrors recurrent_ppo.yaml:20 / neuromodulated_ppo.yaml:20. Mandatory since commit f1db0f0.

  # Encoding Configuration
  encoding_mode: "hierarchical"  # "flat" or "hierarchical"

  hierarchical_params:
    # Unimodal Phase 1: Independent MLPs for each sensor
    # Available sensor names for overrides:
    # [Injury, Nutrition, Satiation, Extero Nociception, Olfaction, Collision, Proprioception, Visual, Location]
    default_mlp: [128,128]
    unimodal_overrides:
      visual: [128,128]
      olfaction: [128,128]
    multimodal_hub: [128,128]

  # Neuromodulation: DISABLED
  # For neuromodulated variant, use: configs/models/dreamer_v3/neuromodulated_dreamer_v3.yaml
  modulation:
    type: null
