# CONTINUAL STAGE 04 — PASSIVE PREDATOR (HUNT-unreachable, sameProp olfactory matched).
# Part of the NMN_CONTINUAL_DOUBLE_RETURN_PROBE schedule (configs/continual/nmn_double_return.yaml).
# This file is BYTE-IDENTICAL to configs/experiment/hypervigilance/02-sameProp_R2_passivePredator.yaml
# below the header — duplication required by the continual schedule machinery (train.py:156).
# The NAS does not support symlinks (per CLAUDE.md Git Safety) so this is a literal copy.
# If the upstream canonical passive config changes, env-config-reviewer must update both
# passive-stage copies (02, 04) to keep parity.
#
# Hypervigilance Round 2 — Cell A1: Passive predator (movement-signature ablation).
#
# Hypothesis under test (per `docs/develop/active/hypervigilance/sameprop_discriminating_channels.md` §4):
# The strongest pre-contact discriminator between rabbit and predator under
# matched olfactory `properties [0,1,0,0,0]` is the predator's HUNT-mode
# movement signature (predator tracks `agent_pos` when `dist <= detection_range`
# and stamina is high; rabbit jitters). The recurrent policy (RPPO/GRU) is
# hypothesized to detect this temporal signature.
#
# Manipulation (THIS CELL):
# Disable predator HUNT mode permanently. Mechanism:
#   - hunt_stamina_threshold: 1.1   ← > 1.0 means rested_enough is NEVER true
#                                     (core.py:156: stamina >= max_stamina * 1.1
#                                     is impossible since stamina is clipped to
#                                     max_stamina).
#   - detection_range: 0            ← belt-and-braces; even if hunt_thresh logic
#                                     drifts, detection_range=0 means dist <= 0
#                                     is required (only same-cell), so HUNT
#                                     transition is unreachable.
# Predator therefore stays in PATROL state (random jitter) for the entire
# episode — kinematically identical to a rabbit, but still emits the same
# olfactory `[0,1,0,0,0]` AND inflicts damage on contact.
#
# Patrol area also restricted to TL+BR quadrants to match rabbits, removing the
# patrol-area asymmetry (channel 3 in the discriminator memo). Two predators
# replace the single full-grid one — count: 1 in TL, count: 1 in BR — to keep
# total predator count == 1 across the grid is NOT possible while restricting
# patrol area cleanly to TL OR BR; we therefore keep ONE predator confined to
# TL [[1,1],[5,5]] (matching one of the two rabbits' areas). This biases the
# predator toward where one rabbit also lives → maximally hard for the agent
# to discriminate without movement signature.
#
# All sensors, body, noise: IDENTICAL to `01-interoNocicept_sameProp.yaml`.
# Diff scope: 4 predator fields (hunt_stamina_threshold, detection_range,
# patrol_area, spawn_area). Nothing else.

