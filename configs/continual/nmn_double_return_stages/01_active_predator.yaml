# CONTINUAL STAGE 01 — ACTIVE PREDATOR (sameProp olfactory matched, full hunt mode).
# Part of the NMN_CONTINUAL_DOUBLE_RETURN_PROBE schedule (configs/continual/nmn_double_return.yaml).
# This file is BYTE-IDENTICAL to configs/experiment/hypervigilance/01-interoNocicept_sameProp.yaml
# below the header — the duplication exists because train.py's continual schedule machinery
# requires one stage YAML per stage in alphabetic order (train.py:156). The NAS does not
# support symlinks (per CLAUDE.md Git Safety), so this is a literal copy. If the upstream
# canonical config changes, env-config-reviewer must update all three active-stage copies
# (01, 03, 05) to keep parity.
#
# Default Configuration for GridWorld Interoceptive AI

