# NMN meta 2x3 mixture probe — context (passive predator, swapped olfactory)
# -------------------------------------------------------------------------
# Specialist cell P6 in `NMN_META_2x3_MIXTURE_PROBE.md` and one of six contexts
# the modulated/unmodulated head-to-head agents train on.
#
# Predator behaviour (m): PASSIVE.
#   HUNT mode unreachable (hunt_stamina_threshold=1.1, detection_range=0); the
#   predator stays in PATROL state for the entire episode. Quadrant-locked TL.
#   Same as `02-sameProp_R2_passivePredator.yaml`.
#
# Olfactory assignment (p): SWAPPED.
#   - predator olfactory = [0, 0, 1, 0, 0]   (canonical basis vector e3)
#   - rabbit  olfactory = [0, 1, 0, 0, 0]   (canonical basis vector e2)
#   - properties_std    = [0, 0, 0, 0, 0]   (zero noise on the olfactory channel)
#
# Olfactory MISLEADS as in active_swapped.yaml. Coupled with passive
# predator (no movement-signature override available — the predator
# *kinematically* matches a rabbit), this context is the LOAD-BEARING-AND-HARDEST
# cell of the 2x3 grid: the only discriminator left is contact-time damage /
# extero-noc / visual ch.5 (cf. existing `02-sameProp_R2_passivePredator.yaml`
# discussion). Survival here measures whether the modulator can build a
# context representation from observation history alone (without leaning on
# olfactory or movement). A modulator-positive specialist on this cell is a
# strong signature that P3 factorisation (per professor-rl/bdl v2 memo §1.3)
# is happening; a flat result here is the cleanest possible refutation.
#
# DIFF FROM `02-sameProp_R2_passivePredator.yaml` (passive+matched baseline):
#   neutral_animals[0..1].properties: [0,1,0,0,0] (UNCHANGED, rabbit stays on e2)
#   predators[0].properties:          [0,1,0,0,0] -> [0,0,1,0,0]   (predator moves e2 -> e3)
# Net: rabbit on e2, predator on e3 — swapped relative to passive_distinct.yaml.

