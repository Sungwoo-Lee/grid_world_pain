body:
  # Body state
  with_satiation: true
  with_nutrition: true
  with_injury: true
  random_start_satiation: false
  random_start_nutrition: false
  random_start_injury: false
  # Body state limits
  max_satiation: 100
  max_nutrition: 100
  max_injury: 100
  # Nutrition: new_N = clip(prev_N - metabolic_cost + [gain - cost if ate], 0, max_N)
  metabolic_cost: 1.0
  food_nutrition_gain: 6
  eating_nutrition_cost: 1.0
  eating_reward_penalty: 0.0
  # Satiation: S = MaxS * (N / MaxN) ^ scaling_factor
  nutrition_to_satiation_scaling_factor: 1.0
  satiation_setpoint: 100
  start_satiation: 100
  start_nutrition: 100
  # Recovery: Recovery = base * (1 + accel)^(rest_streak - 1)
  recovery_base_rate: 0.1
  recovery_accel_rate: 0.5
  # Injury: Damage is spread over duration steps (applied_dam = total_dam / duration)
  injury_smoothing_duration: 3
  # Reward: if use_homeostatic_reward, Reward = prev_drive - curr_drive
  # Drive (Euclidean): sqrt((satiation - setpoint)^2 + injury^2)
  use_homeostatic_reward: true
  death_penalty: 100
  overeating_death: false


sensory:
  using_sensory: true
  #Olfactory sensor
  olfactory_enabled: true
  sensor_radius: 20
  vector_size: 5
  decay_power: 2.0
  #Collision sensor
  collision_sensor_range: 1
  #Location sensor
  location_sensor: false 
  #Nociception sensor
  nociception_enabled: true
  nociception_size: 1
  #Visual sensor
  visual_sensor_enabled: true
  visual_sensor_range: 0
  #Proprioception sensor
  proprioception_enabled: true

  # Hidden-state observability gates (default true = backward compatible)
  injury_observable: false
  nutrition_observable: false
  # Interoceptive nociception: tonic, delayed perception of hidden injury via alpha-kernel convolution.
  # alpha kernel: k_raw[i] = (i/tau) * exp(1 - i/tau), normalized so sum(k)=1. k[0]=0 → no instantaneous leak.
  # Peak at i=tau steps. kernel_length should cover ~4*tau for low truncation error.
  interoceptive_nociception_enabled: true
  # When false, the sensor bypasses the alpha kernel entirely and emits
  # injury_level/max_injury directly (intero == injury, no delay, no smoothing).
  # Use for ablations or to recover the pre-convolution baseline. tau and
  # kernel_length below are still parsed for shape stability but unused.
  interoceptive_convolution_enabled: true
  interoceptive_kernel_tau: 3.0
  interoceptive_kernel_length: 12

visualization:
  local_view_size: 5

perceptual_noise:
  enabled: false
  # Key order here is the single source of truth for noise array indices (0-8).
  # config_loader.py reads this order; sensor.py consumes it via params.noise_modality_order.
  modalities:
    injury:          # index 0
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    nutrition:       # index 1
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    satiation:       # index 2 — interoceptive
      mode: "state_dependent"
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    interoceptive_nociception:  # index 3 — interoceptive (new)
      mode: "state_dependent"
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    extero_nociception: # index 4 (was 3) — exteroceptive
      mode: "state_dependent"
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0     # Unbounded (pain intensity)
    olfaction:       # index 5 (was 4)
      mode: "state_dependent"
      sigma: 0.2
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0     # Unbounded (aggregated chemical gradient)
    collision:       # index 6 (was 5)
      mode: "constant"
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    proprioception:  # index 7 (was 6)
      mode: "constant"
      sigma: 0.05
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    visual:          # index 8 (was 7)
      mode: "state_dependent"
      sigma: 0.2
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0     # Unbounded (one-hot counts)
    location:        # index 9 (was 8)
      mode: "constant"
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: -1.0       # Normalized to [-1, 1]
      clip_max: 1.0

