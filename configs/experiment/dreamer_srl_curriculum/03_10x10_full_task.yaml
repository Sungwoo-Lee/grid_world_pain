# Stage 3 of dreamer_srl_curriculum (3-stage size+entity curriculum) — TARGET TASK
# ----------------------------------------------------------------------------
# Plain-language purpose:
#   The full task, at full size. A 10x10 grid with the complete entity set:
#   FOOD, the STATIC LETHAL hiding predators (one per quadrant), a MOVING
#   CHASING PREDATOR that patrols the whole grid, NEUTRAL RABBITS (harmless
#   moving animals the agent must learn to ignore / not confuse with the
#   chaser), ROCKS (mild obstacles), and HIDING BUSHES. This is the 10x10
#   hypervigilance survival task that the from-scratch dreamer_srl baseline
#   was trained on (the three 10M-episode parity cells). The curriculum's
#   success criterion is measured HERE: does a dreamer_srl that warmed up on
#   Stages 1->2 reach higher survival on this task than one trained on it
#   from scratch?
#
# Provenance: the environment / body / sensory / perceptual_noise blocks are
#   BYTE-IDENTICAL to configs/experiment/hypervigilance/01-interoNocicept.yaml
#   (the running from-scratch baseline's env config), minus that file's
#   trailing behavior_measures eval block — which is intentionally omitted so
#   the modality fingerprint matches Stages 01 and 02 (neither carries it).
#   Stage 3 entity set already equals the locked spec:
#     food + hiding_predator + chasing predator + rabbit + rock + bush.
#
# Entity -> v2.0 schema mapping:
#   food            -> resources entries, type: food
#   hiding_predator -> resources entries, type: hiding_predator (static lethal)
#   chasing predator-> predators[] entry (class predator, behaviour hunt, full-grid patrol)
#   rabbit          -> neutral_animals[] entries (class neutral, behaviour wander) — Stage-3 only
#   rock            -> obstacles entries (present in ALL stages)
#   bush            -> obstacles entries, hides_agent: true (present with the chaser)
#
# Cross-stage modality fingerprint:
#   sensory / body / perceptual_noise blocks are BYTE-IDENTICAL to Stages 01
#   and 02. Only entity counts/params and grid geometry (5x5 -> 10x10) change.
#   The egocentric observation is grid-size-invariant (visual patch sized by
#   visual_sensor_range, not grid h/w), so the 5x5 -> 10x10 jump is shape-safe.
#
# Design doc:
#   docs/experiments/active/continual_learning/DREAMER_SRL_3STAGE_SIZE_CURRICULUM.md

environment:
