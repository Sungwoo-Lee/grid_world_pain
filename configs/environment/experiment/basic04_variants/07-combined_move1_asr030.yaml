# basic04 variant — 07-combined_move1_asr030
# ---------------------------------------------------------------------------
# WHAT THIS CHANGES (plain language): a softened version of the harsh baseline
# level `basic/04` (the "jump" level) that combines THREE relaxations of the
# chasing predator BUT deliberately KEEPS the predator fast:
#   1. pounce reach `attack_range` [2, 3] -> [1, 2]      — holding a 2-3 cell gap is safe again.
#   2. hit damage `damage` 15-120 -> 15-80 injury points — no more one-shot kills (body dies at 100).
#   3. pounce hit rate `attack_success_rate` 0.5 -> 0.3  — only ~1 in 3 pounces land; misses land adjacent.
# The predator's step cadence `move_interval` STAYS [1, 1] — full speed.
#
# WHY (key contrast): the existing `04-all_combined.yaml` also softens the level
# by all knobs, but it slows the predator to move_interval [1, 3]. The 2026-07-21
# diary finding showed that slowing the predator SUPPRESSES bush-hiding the most
# (~8% dwell vs ~50% lethal baseline), while a FAST predator (move_interval [1,1])
# is what KEEPS the hiding behaviour alive. So this variant is "all-combined
# EXCEPT move_interval": it softens the attack (reach, damage, hit rate) to make
# the level learnable, while keeping the fast chase that preserves bush-hiding.
# This is the softer-hit-rate (0.3) member of the pair; 08 is the harder (0.7) one.
#
# Everything else is identical to basic/04: full-speed chase [1,1], detection range
# [1,7], stamina [30,150], attack delay [1,3], 0-2 predators, the rabbit, ambush
# predators 2-12, bushes 4-10, random start injury, and no sensory noise.
#
# NOTE ON THE LIST-REPLACE FOOTGUN: `environment.entities` is a YAML list, and a
# child config REPLACES the whole list rather than merging per entry. So the
# complete list is restated below — predator AND rabbit — copied verbatim from
# basic/04 except for the three changed lines. Nothing else (resources /
# obstacles / body / perceptual_noise) is redeclared, so those stay inherited and
# cannot drift.
extends: environment/experiment/basic/04-jump_attack_10x10

environment:
  entities:
    - class: "predator"
      behaviour: "hunt"
      tag: "pred"
      count_low: 0
      count_high: 2
      properties: [0.0, 0.7, 0.5, 0.0, 0.0]
      properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
      visual_properties: [0, 0, 0, 0, 0, 1, 0, 0]
      visual_properties_std: [0, 0, 0, 0, 0, 0, 0, 0]
      move_interval: [1, 1]          # KEPT [1,1] (NOT [1,3]): fast predator preserves bush-hiding
      damage: [15.0, 80.0]           # CHANGED (was [15.0, 120.0]): no one-shot kill (max_injury = 100)
      attack_delay: [1, 3]
      nociception_intensity: 0.9
      spawn_area: [[1, 1], [10, 10]]
      patrol_area: [[1, 1], [10, 10]]
      detection_range: [1, 7]
      max_stamina: [30, 150]
      stamina_recovery_rate: [1, 1]
      hunt_stamina_threshold: [0.7, 0.7]
      lose_interest_multiplier: [1.5, 1.5]
      attack_range: [1, 2]           # CHANGED (was [2, 3]): shorter pounce reach
      attack_success_rate: 0.3       # CHANGED (was 0.5): softer pounce hit-rate, misses land adjacent
    - class: "neutral"
      behaviour: "wander"
      tag: "rabbit"
      count_low: 0
      count_high: 2
      properties: [0.0, 0.5, 0.7, 0.0, 0.0]
      properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
      visual_properties: [0, 0, 0, 0, 0, 0, 0, 1]
      visual_properties_std: [0, 0, 0, 0, 0, 0, 0, 0]
      move_interval: [1, 1]
      damage: [0.0, 0.0]
      attack_delay: [0, 0]
      nociception_intensity: 0.1
      spawn_area: [[1, 1], [10, 10]]
      patrol_area: [[1, 1], [10, 10]]
