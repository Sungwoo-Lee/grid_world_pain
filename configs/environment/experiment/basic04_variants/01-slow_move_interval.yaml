# basic04 variant — 01-slow_move_interval
# ---------------------------------------------------------------------------
# WHAT THIS CHANGES (plain language): exactly one predator knob, versus the harsh
# baseline level `basic/04` (the "jump" level). The chasing predator's step cadence
# `move_interval` goes from "always full speed" [1, 1] to "1 to 3 steps per move"
# [1, 3]. Each episode draws a cadence from that range, so on many episodes the
# predator moves only every 2nd or 3rd tick.
#
# WHY: in basic/04 the predator matches the agent's speed exactly, so once it locks
# on there is no outrunning it — the only survivable option is reaching a bush before
# it closes. Letting the predator sometimes be slower restores fleeing as a real
# option and gives the agent time to find cover.
#
# Everything else is identical to basic/04: pounce reach [2,3], 50% pounce hit rate,
# damage up to 120, detection range [1,7], stamina [30,150], attack delay [1,3],
# 0-2 predators, the rabbit, ambush predators 2-12, bushes 4-10, random start injury,
# and no sensory noise.
#
# NOTE ON THE LIST-REPLACE FOOTGUN: `environment.entities` is a YAML list, and a child
# config REPLACES the whole list rather than merging per entry. So the complete list is
# restated below — predator AND rabbit — copied verbatim from basic/04 except for the
# single changed line. Nothing else (resources / obstacles / body / perceptual_noise) is
# redeclared, so those stay inherited and cannot drift.
extends: environment/experiment/basic/04-jump_attack_10x10

environment:
  entities:
    - class: "predator"
      behaviour: "hunt"
      tag: "pred"
      count_low: 0
      count_high: 2
      properties: [0.0, 0.7, 0.5, 0.0, 0.0]
      properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
      visual_properties: [0, 0, 0, 0, 0, 1, 0, 0]
      visual_properties_std: [0, 0, 0, 0, 0, 0, 0, 0]
      move_interval: [1, 3]          # CHANGED (was [1, 1]): predator may be slower than the agent
      damage: [15.0, 120.0]
      attack_delay: [1, 3]
      nociception_intensity: 0.9
      spawn_area: [[1, 1], [10, 10]]
      patrol_area: [[1, 1], [10, 10]]
      detection_range: [1, 7]
      max_stamina: [30, 150]
      stamina_recovery_rate: [1, 1]
      hunt_stamina_threshold: [0.7, 0.7]
      lose_interest_multiplier: [1.5, 1.5]
      attack_range: [2, 3]
      attack_success_rate: 0.5
    - class: "neutral"
      behaviour: "wander"
      tag: "rabbit"
      count_low: 0
      count_high: 2
      properties: [0.0, 0.5, 0.7, 0.0, 0.0]
      properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
      visual_properties: [0, 0, 0, 0, 0, 0, 0, 1]
      visual_properties_std: [0, 0, 0, 0, 0, 0, 0, 0]
      move_interval: [1, 1]
      damage: [0.0, 0.0]
      attack_delay: [0, 0]
      nociception_intensity: 0.1
      spawn_area: [[1, 1], [10, 10]]
      patrol_area: [[1, 1], [10, 10]]
