  eval_n_episodes: 200
  eval_seeds:
    rng: 42
    sort: true
  eval_policy_mode: deterministic
  eval_max_steps: 500
  eval_obs_noise: training
  motif_window_K: 7
  motif_features: [net_displacement, path_length, threat_distance_change_rate, min_threat_distance,
