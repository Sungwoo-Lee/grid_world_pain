# NMN Noise Heterogeneity Sweep — Profile P2 (MILD)
# ----------------------------------------------------------
# Bearing-channel σ profile (5 noise-bearing modalities):
#   satiation=0.08, intero_noc=0.10, extero_noc=0.12, olfaction=0.18, visual=0.22
# Mean σ (bearing) = 0.140    max/min ratio (bearing) = 2.75
#
# Rung 2 of the heterogeneity gradient. Mean σ pinned at 0.140 (= P1) so total
# information loss is matched against P1; only the spread across modalities
# changes. Min reduced (satiation), max increased (visual) symmetrically.

