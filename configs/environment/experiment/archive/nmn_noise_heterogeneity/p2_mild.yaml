body:
  with_satiation: true
  with_nutrition: true
  with_injury: true
  random_start_satiation: false
  random_start_nutrition: false
  random_start_injury: false
  max_satiation: 100
  max_nutrition: 100
  max_injury: 100
  metabolic_cost: 1.0
  food_nutrition_gain: 6
  eating_nutrition_cost: 1.0
  eating_reward_penalty: 0.0
  nutrition_to_satiation_scaling_factor: 1.0
  satiation_setpoint: 100
  start_satiation: 100
  start_nutrition: 100
  recovery_base_rate: 0.1
  recovery_accel_rate: 0.5
  injury_smoothing_duration: 3
  use_homeostatic_reward: true
  death_penalty: 100
  overeating_death: false


sensory:
  visual_value_mode: sum
  visual_occlusion_enabled: false
  olfactory_grid_range: 0
  visual_blur_enabled: false
  visual_blur_radial_scale: 0.5
  visual_blur_anisotropy: 3.0
  visual_blur_sigma_floor: 0.5
  using_sensory: true
  olfactory_enabled: true
  sensor_radius: 20
  vector_size: 5
  decay_power: 2.0
  collision_sensor_range: 1
  location_sensor: false
  nociception_enabled: true
  nociception_size: 1
  visual_sensor_enabled: true
  visual_sensor_range: 0
  proprioception_enabled: true

  injury_observable: false
  nutrition_observable: false
  interoceptive_nociception_enabled: true
  interoceptive_convolution_enabled: true
  interoceptive_kernel_tau: 3.0
  interoceptive_kernel_length: 12

visualization:
  local_view_size: 5

# ============================================================================
# Profile P2 (MILD heterogeneity) — bearing max/min = 2.75, mean = 0.140
# ============================================================================
perceptual_noise:
  enabled: true
  modalities:
    injury:
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    nutrition:
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    satiation:                      # bearing — reduced
      mode: "state_dependent"
      sigma: 0.08
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    interoceptive_nociception:      # bearing — unchanged
      mode: "state_dependent"
      sigma: 0.10
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    extero_nociception:             # bearing — slightly raised
      mode: "state_dependent"
      sigma: 0.12
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    olfaction:                      # bearing — slightly reduced
      mode: "state_dependent"
      sigma: 0.18
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    collision:
      mode: "constant"
      sigma: 0.00
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    proprioception:
      mode: "constant"
      sigma: 0.00
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    visual:                         # bearing — raised
      mode: "state_dependent"
      sigma: 0.22
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    location:
      mode: "constant"
      sigma: 0.00
      injury_noise_scale: 0.0
      clip_min: -1.0
      clip_max: 1.0
