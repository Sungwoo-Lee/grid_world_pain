body:
  # Body state
  with_satiation: true
  with_nutrition: true
  with_injury: true
  random_start_satiation: false
  random_start_nutrition: false
  random_start_injury: false
  # Body state limits
  max_satiation: 100
  max_nutrition: 100
  max_injury: 100
  # Nutrition: new_N = clip(prev_N - metabolic_cost + [gain - cost if ate], 0, max_N)
  metabolic_cost: 1.0
  food_nutrition_gain: 6
  eating_nutrition_cost: 1.0
  eating_reward_penalty: 0.0
  # Satiation: S = MaxS * (N / MaxN) ^ scaling_factor
  nutrition_to_satiation_scaling_factor: 1.0
  satiation_setpoint: 100
  start_satiation: 100
  start_nutrition: 100
  # Recovery: Recovery = base * (1 + accel)^(rest_streak - 1)
  recovery_base_rate: 0.1
  recovery_accel_rate: 0.5
  # Injury: Damage is spread over duration steps (applied_dam = total_dam / duration)
  injury_smoothing_duration: 3
  # Reward: if use_homeostatic_reward, Reward = prev_drive - curr_drive
  # Drive (Euclidean): sqrt((satiation - setpoint)^2 + injury^2)
  use_homeostatic_reward: true
  death_penalty: 100
  overeating_death: false


sensory:
  using_sensory: true
  #Olfactory sensor
  olfactory_enabled: true
  sensor_radius: 20
  vector_size: 5
  decay_power: 2.0
  #Collision sensor
  collision_sensor_range: 1
  #Location sensor
  location_sensor: false
  #Nociception sensor
  nociception_enabled: true
  nociception_size: 1
  #Visual sensor
  visual_sensor_enabled: true
  visual_sensor_range: 0
  #Proprioception sensor
  proprioception_enabled: true

  # Hidden-state observability gates
  injury_observable: false
  nutrition_observable: false
  # Interoceptive nociception: tonic, delayed perception of hidden injury via alpha-kernel convolution.
  interoceptive_nociception_enabled: true
  interoceptive_convolution_enabled: true
  interoceptive_kernel_tau: 3.0
  interoceptive_kernel_length: 12

visualization:
  local_view_size: 5

# ============================================================================
# Profile P1 (FLAT, anchor) — bearing max/min = 2.0, mean = 0.140
# ============================================================================
perceptual_noise:
  enabled: true
  # Key order is the single source of truth for noise array indices.
  # config_loader.py reads this order; sensor.py consumes it via params.noise_modality_order.
  modalities:
    injury:                         # not observed (injury_observable: false); σ inert
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    nutrition:                      # not observed (nutrition_observable: false); σ inert
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    satiation:                      # bearing modality (interoceptive)
      mode: "state_dependent"
      sigma: 0.10
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    interoceptive_nociception:      # bearing modality (interoceptive)
      mode: "state_dependent"
      sigma: 0.10
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    extero_nociception:             # bearing modality (exteroceptive)
      mode: "state_dependent"
      sigma: 0.10
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    olfaction:                      # bearing modality
      mode: "state_dependent"
      sigma: 0.20
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    collision:                      # noise-free physical signal
      mode: "constant"
      sigma: 0.00
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    proprioception:                 # noise-free physical signal
      mode: "constant"
      sigma: 0.00
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    visual:                         # bearing modality
      mode: "state_dependent"
      sigma: 0.20
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    location:                       # noise-free
      mode: "constant"
      sigma: 0.00
      injury_noise_scale: 0.0
      clip_min: -1.0
      clip_max: 1.0
