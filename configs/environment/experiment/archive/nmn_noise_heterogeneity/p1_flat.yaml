# NMN Noise Heterogeneity Sweep — Profile P1 (FLAT, anchor)
# ----------------------------------------------------------
# Bearing-channel σ profile (5 noise-bearing modalities):
#   satiation=0.10, intero_noc=0.10, extero_noc=0.10, olfaction=0.20, visual=0.20
# Mean σ (bearing) = 0.140    max/min ratio (bearing) = 2.0
#
# This profile is BYTE-IDENTICAL to configs/experiment/hypervigilance/01-interoNocicept_noise.yaml
# (the v8 §2.2 controlled-variables noise preset). It serves as the anchor of the
# heterogeneity gradient. Any deviation from baseline survival here is a
# replication artefact, not a heterogeneity effect.
#
# Env body (lines 3-298) is identical across P1..P5 — only perceptual_noise differs.

