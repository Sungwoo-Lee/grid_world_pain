  eval_max_steps: 500                    # matches environment.max_steps.
  eval_obs_noise: training               # match training-time noise profile (deterministic policy, training noise).
  # Offline M7 motif clustering
  motif_window_K: 7
  motif_features:                        # locked v1 list -- names enforced by loader's _DEFAULT_FEATURE_NAMES.
    - net_displacement
    - path_length
    - threat_distance_change_rate
    - min_threat_distance
    - bush_occupancy_fraction
    - eat_events_per_window
    - action_entropy
    - mode_action_fraction
    - stay_in_place_fraction
    - drive_injury_change
  motif_kmeans_k: 6
  motif_kmeans_seed: 42
  motif_standardise: zscore_pooled       # enum: zscore_pooled | zscore_per_agent | none.
  eval_output_root: results/eval

perceptual_noise:
  enabled: false
  # Key order here is the single source of truth for noise array indices (0-8).
  modalities:
    injury:          # index 0
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    nutrition:       # index 1
      mode: "state_dependent"
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    satiation:       # index 2 -- interoceptive
      mode: "state_dependent"
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    interoceptive_nociception:  # index 3 -- interoceptive (new)
      mode: "state_dependent"
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    extero_nociception: # index 4 (was 3) -- exteroceptive
      mode: "state_dependent"
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0     # Unbounded (pain intensity)
    olfaction:       # index 5 (was 4)
      mode: "state_dependent"
      sigma: 0.2
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0     # Unbounded (aggregated chemical gradient)
    collision:       # index 6 (was 5)
      mode: "constant"
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    proprioception:  # index 7 (was 6)
      mode: "constant"
      sigma: 0.05
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    visual:          # index 8 (was 7)
      mode: "state_dependent"
      sigma: 0.2
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0     # Unbounded (one-hot counts)
    location:        # index 9 (was 8)
      mode: "constant"
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: -1.0       # Normalized to [-1, 1]
      clip_max: 1.0
