# NMN meta 2x3 mixture probe — context (active predator, swapped olfactory)
# -------------------------------------------------------------------------
# Specialist cell P3 in `NMN_META_2x3_MIXTURE_PROBE.md` and one of six contexts
# the modulated/unmodulated head-to-head agents train on.
#
# Predator behaviour (m): ACTIVE (full hunt mode, baseline 01-interoNocicept_sameProp).
# Olfactory assignment (p): SWAPPED.
#   - predator olfactory = [0, 0, 1, 0, 0]   (canonical basis vector e3 — rabbit's distinct slot)
#   - rabbit  olfactory = [0, 1, 0, 0, 0]   (canonical basis vector e2 — predator's distinct slot)
#   - properties_std    = [0, 0, 0, 0, 0]   (zero noise on the olfactory channel)
#
# This is the LOAD-BEARING context (per professor-rl/bdl v2 memo §2.3 and
# postdoc synthesis v2 §6). Olfactory cues here actively MISLEAD: an agent
# that learned "channel e2 = predator" on distinct-canonical will, on this
# context, treat the rabbit (now on e2) as if it were a predator. Recovering
# correct behaviour requires the agent to either (a) re-learn the olfactory
# → identity mapping per context using the modulator's hidden state, or
# (b) override olfactory with the predator movement signature. Both routes
# test the (b)-frame meta-RL claim. Corner-camping does NOT solve swapped
# (the rabbit corner smells like predator, the predator can be anywhere),
# so survival here is a clean discriminator unlike matched-context survival
# where corner-camping confounds the read-out (postdoc synthesis v2 §6).
#
# DIFF FROM `01-interoNocicept_sameProp.yaml` (the active+matched baseline):
#   neutral_animals[0..1].properties: [0,1,0,0,0] (e2) — UNCHANGED, rabbit stays on e2
#   predators[0].properties:          [0,1,0,0,0] -> [0,0,1,0,0]   (predator moves e2 -> e3)
# Net: rabbit on e2, predator on e3. Compared to active_distinct.yaml (rabbit
# on e3, predator on e2), this is the canonical "swap" of the olfactory
# identities. Predator behaviour params unchanged (active hunt).
# properties_std stays [0,0,0,0,0]. Everything else byte-identical.
#
# Hand-off: env-config-auditor must verify the {active, passive} x {matched,
# distinct, swapped} = 6 configs share identical bodies / sensor params and
# differ ONLY along the two design axes (predator behaviour, olfactory assignment).

