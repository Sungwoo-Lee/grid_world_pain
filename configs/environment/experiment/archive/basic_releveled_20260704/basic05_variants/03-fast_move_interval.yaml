# basic05 variant 03 — FIXED FAST MOVE INTERVAL
# Purpose: pin the chasing predator's move_interval to a constant 1 (always full-speed),
# instead of basic-05's random [1,3]. Tests the effect of a consistently fast predator
# (no slow-predator episodes). Only predator move_interval changes; rest inherits basic-05.
# (Must redeclare the whole `entities` list because the config system replaces lists wholesale.)
extends: environment/experiment/basic/05-random_init_10x10

environment:
  entities:
    - class: "predator"
      behaviour: "hunt"
      tag: "pred"
      count_low: 0
      count_high: 2
      properties: [0.0, 0.7, 0.5, 0.0, 0.0]
      properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
      visual_properties: [0, 0, 0, 0, 0, 1, 0, 0]
      visual_properties_std: [0, 0, 0, 0, 0, 0, 0, 0]
      move_interval: [1, 1]              # VARIANT: was [1,3] — always full-speed, no slow episodes
      damage: [15.0, 120.0]
      attack_delay: [1, 3]
      nociception_intensity: 0.9
      spawn_area: [[1, 1], [10, 10]]
      patrol_area: [[1, 1], [10, 10]]
      detection_range: [1, 7]
      max_stamina: [30, 30]
      stamina_recovery_rate: [1, 1]
      hunt_stamina_threshold: [0.7, 0.7]
      lose_interest_multiplier: [1.5, 1.5]
    - class: "neutral"
      behaviour: "wander"
      tag: "rabbit"
      count_low: 0
      count_high: 2
      properties: [0.0, 0.5, 0.7, 0.0, 0.0]
      properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
      visual_properties: [0, 0, 0, 0, 0, 0, 0, 1]
      visual_properties_std: [0, 0, 0, 0, 0, 0, 0, 0]
      move_interval: [1, 1]
      damage: [0.0, 0.0]
      attack_delay: [0, 0]
      nociception_intensity: 0.1
      spawn_area: [[1, 1], [10, 10]]
      patrol_area: [[1, 1], [10, 10]]
