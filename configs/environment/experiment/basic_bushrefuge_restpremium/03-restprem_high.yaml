# ============================================================================
# REST-PREMIUM arm "high" — bush-refuge basic03 with the injury-recovery
# curve retuned so that UNINTERRUPTED resting is worth 3815x more per step
# than restarting after an interruption.
#
# WHY: injury heals ONLY via the Rest action (src/environment/core.py:104), so
# an injured agent freezes-and-heals wherever it stands and UNDER-uses cover
# (verified: rest 86%, bush 1-3% while injured — llm_wiki
# 20260810_1753_bushrefuge_injury_suppresses_bush_use_heal_by_rest).
# Raising the streak premium makes an interruption costly, so a SAFE place to
# complete a long rest (the refuge bush, which predators cannot enter) should
# become worth travelling to => injury should INCREASE cover use.
#
# SINGLE VARIABLE: the injured window is held ~constant across the three arms
# (~13-15 steps to shed injury 70) by lowering recovery_base_rate as
# recovery_accel_rate rises — so PREMIUM is the only thing that differs.
#   arm    base      accel   window   premium(@10th rest)
#   low    0.1       0.5     15       38x      (== current/default regime)
#   mid    0.01      1.0     13       512x
#   high   0.0007    1.5     14       3815x
#
# Everything else (bush-refuge, random init, entity ranges, clean smell,
# decay_power 1.0) is inherited unchanged from the sibling bushrefuge config.
# ============================================================================
extends: environment/experiment/basic_bushrefuge/03-random_init_10x10

body:
  # Recovery = base * (1 + accel)^(rest_streak - 1)
  recovery_base_rate: 0.0007
  recovery_accel_rate: 1.5
