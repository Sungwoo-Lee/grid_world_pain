# ============================================================================
# REST-PREMIUM sweep, arm 05 of 10  —  premium 323x  (accel 0.9, base 0.0079)
# Base task: bush-refuge basic04 (JUMP-ATTACK 10x10) — predators can pounce, so
# diving into the refuge bush matters most here.
#
# QUESTION: injury heals ONLY via the Rest action (src/environment/core.py:104),
# so an injured agent freezes-and-heals wherever it stands and UNDER-uses cover
# (measured: rest 86%, bush 1-3% while injured — llm_wiki
# 20260810_1753_bushrefuge_injury_suppresses_bush_use_heal_by_rest). Making an
# UNINTERRUPTED rest streak valuable should make a SAFE spot to complete the
# heal (the refuge bush, which predators cannot enter) worth travelling to
# => injury should INCREASE cover use rather than suppress it.
#
# SINGLE VARIABLE: recovery_base_rate is solved so every arm still sheds
# injury 70 in ~13-15 rest steps, so the INJURED WINDOW is matched across arms
# and only the continuity premium differs (1x .. 129962x, log-spaced).
#   premium = healing on the 10th consecutive rest / the 1st after an interruption
#   arm01 is the ZERO-PREMIUM anchor (flat rate, no continuity incentive);
#   arm03 (38x) == the current/default regime.
#
# Everything else (bush-refuge blocks_animals, jump attack, entity ranges,
# clean smell, decay_power 1.0) is inherited unchanged.
# ============================================================================
extends: environment/experiment/basic_bushrefuge/04-jump_attack_10x10

body:
  # Recovery = base * (1 + accel)^(rest_streak - 1)
  recovery_base_rate: 0.0079
  recovery_accel_rate: 0.9
