    - 1
    - 0
    - 0
    - 0
    - 0
    - 0
  proprioception_enabled: true
  injury_observable: false
  nutrition_observable: false
  interoceptive_nociception_enabled: true
  interoceptive_convolution_enabled: true
  interoceptive_kernel_tau: 3.0
  interoceptive_kernel_length: 12
  visual_occlusion_cone_deg: 15.0
  visual_occlusion_strength: 1.0
visualization:
  local_view_size: 5
behavior_measures:
  enabled: false
  cue_radius: 3.0
  obs_window: 5
  eval_n_episodes: 200
  eval_seeds:
    rng: 42
    sort: true
  eval_policy_mode: deterministic
  eval_max_steps: 500
  eval_obs_noise: training
  motif_window_K: 7
  motif_features:
  - net_displacement
  - path_length
  - threat_distance_change_rate
  - min_threat_distance
  - bush_occupancy_fraction
  - eat_events_per_window
  - action_entropy
  - mode_action_fraction
  - stay_in_place_fraction
  - drive_injury_change
  motif_kmeans_k: 6
  motif_kmeans_seed: 42
  motif_standardise: zscore_pooled
  eval_output_root: results/eval
perceptual_noise:
  enabled: false
  modalities:
    injury:
      mode: state_dependent
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    nutrition:
      mode: state_dependent
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    satiation:
      mode: state_dependent
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    interoceptive_nociception:
      mode: state_dependent
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    extero_nociception:
      mode: state_dependent
      sigma: 0.1
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    olfaction:
      mode: state_dependent
      sigma: 0.2
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    collision:
      mode: constant
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    proprioception:
      mode: constant
      sigma: 0.05
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    visual:
      mode: state_dependent
      sigma: 0.2
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 100.0
    location:
      mode: constant
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: -1.0
      clip_max: 1.0
