body:
  with_satiation: true
  with_nutrition: true
  with_injury: true
  random_start_satiation: false
  random_start_nutrition: true
  random_start_injury: true
  start_nutrition_low: 0
  start_nutrition_high: 100
  start_injury_low: 0
  start_injury_high: 100
  max_satiation: 100
  max_nutrition: 100
  max_injury: 100
  metabolic_cost: 1.0
  food_nutrition_gain: 6
  eating_nutrition_cost: 1.0
