# NOISE-matched avoidance probe for the v5_allnoise model (rppo_basic05v5_allnoise).
# Frozen-probe principle: eval sensory config must match the model's TRAINING regime.
# Extends the CORE probe (fixed-init, for seed-42 videos).
# Adds vs the clean probe: (A) perceptual_noise block (verbatim v5 values),
#   (B) behavior_measures.eval_obs_noise=training, (C) animal properties_std -> [0,0.4,0.4,0,0].
# Study: docs/experiments/active/behavior_measures/interoceptive_behavior_measure_study.md
extends: environment/experiment/behavior_probes/core/avoidance/avoid_none_inj00

# (A) Perceptual noise (verbatim from v5_allnoise saved config); (B) eval applies training noise.
perceptual_noise:
  enabled: true
  modalities:
    injury:
      mode: state_dependent
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    nutrition:
      mode: state_dependent
      sigma: 0.0
      injury_noise_scale: 1.5
      clip_min: 0.0
      clip_max: 1.0
    satiation:
      mode: constant
      sigma: 0.1
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    interoceptive_nociception:
      mode: constant
      sigma: 0.1
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    extero_nociception:
      mode: constant
      sigma: 0.1
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 100.0
    olfaction:
      mode: state_dependent
      sigma: 0.15
      injury_noise_scale: 4.0
      clip_min: 0.0
      clip_max: 100.0
    collision:
      mode: constant
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    proprioception:
      mode: constant
      sigma: 0.05
      injury_noise_scale: 0.0
      clip_min: 0.0
      clip_max: 1.0
    visual:
      mode: state_dependent
      sigma: 0.1
      injury_noise_scale: 2.0
      clip_min: 0.0
      clip_max: 100.0
    location:
      mode: constant
      sigma: 0.01
      injury_noise_scale: 0.0
      clip_min: -1.0
      clip_max: 1.0

behavior_measures:
  eval_obs_noise: training
