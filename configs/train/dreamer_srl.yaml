# Dreamer-specific training defaults.
#
# WHY THIS FILE EXISTS
# --------------------
# configs/train/default.yaml is shared by BOTH rPPO (train.py) and dreamer
# (src/algorithms/dreamer_srl/dreamer_srl_main.py). It used to carry Dreamer's
# per-algo values directly — which "worked" only because Dreamer was the sole
# consumer without an override layer, and made the shared file dishonest (it
# was labelled "Dreamer's value"). This file is Dreamer's override layer, exactly
# symmetric with configs/train/recurrent_ppo.yaml.
#
# PRECEDENCE
# ----------
# Merged ABOVE configs/train/default.yaml but BELOW the env --env-config and the
# --agent-config (and below CLI flags like --log-interval), so these remain
# overridable defaults. rPPO never loads this file.
#
# NO ALGORITHM GATE — DELIBERATE ASYMMETRY WITH rPPO
# --------------------------------------------------
# train.py gates recurrent_ppo.yaml on agent.algorithm == "RecurrentPPO" because
# train.py is shared across algorithms. dreamer_srl_main.py is the Dreamer entry
# point and only ever runs Dreamer, so it merges this file unconditionally.
# A gate would ALSO break agent_xs.yaml and 01_food_only_smoke.yaml, which do not
# declare agent.algorithm. Do not add a gate.
# See docs/develop/active/refactors/DREAMER_TRAIN_CONFIG_SPLIT.md
#
# SELF-CONTAINED CONVENTION (reversal of the earlier "smoothing_episodes lives only in
# default.yaml" structural enforcement — see docs/develop/active/refactors/DREAMER_TRAIN_CONFIG_SPLIT.md
# for the superseded rationale). This file declares its OWN complete set of values so it
# can be read top-to-bottom without cross-referencing default.yaml or recurrent_ppo.yaml.
# configs/train/default.yaml ALSO declares every one of these keys (generic defaults, for
# documentation + as the DQN/DRQN/PPO fallback) — the duplication is intentional; THIS
# file wins for Dreamer because it is merged above default.yaml. Intentional and
# user-approved.
training:
  num_envs: 128                 # Dreamer's parallel-env count (was CLI-only; now config-owned)
  # Episode-based termination, matching rPPO's 100M-episode convention. Dreamer's
  # loop is dual-mode: it stops on EPISODES unless --total-steps/--total-timesteps
  # is passed, which silently switches it to an env-step cap (that is what ended
  # dsrl_b04_M_128env_n114 at exactly 50M env-steps). Do NOT pass --total-steps.
  episodes: 100000000
  checkpoint_frequency: 10000   # checkpoint + eval video every 10,000 episodes
  max_checkpoints_to_keep: 20   # rotate; keep the 20 most recent
  # Async checkpoint-video render (src/utils/async_render.py; docs/develop/active/
  # refactors/ASYNC_CHECKPOINT_VIDEO_RENDER.md). true is the FIX for the measured
  # 10.7-44% wall-clock lost to blocking renders — the MP4 render becomes a
  # non-blocking CPU subprocess; false is the documented kill-switch (legacy
  # blocking render). Recordings + checkpoints are unaffected either way.
  async_video_render: true
  render_every_n_checkpoints: 1 # 1 = MP4 every checkpoint (today's cadence)
  # Caps the render child's worker pool now that it runs CONCURRENTLY with training.
  # Largely inert in practice: the renderer parallelises per episode, so with
  # eval_video_episodes: 3 at most 3 workers ever do work. null = cpu_count - 1.
  render_workers: 8

# Two-level logging: Dreamer's COMPLETE logging block (all four knobs), self-contained.
# CONVENTION (not enforced structurally): logging.episode.smoothing_episodes should be kept
# EQUAL to configs/train/recurrent_ppo.yaml's value so Dreamer and rPPO learning curves
# average the same number of episodes per point and remain visually comparable. The two
# copies are intentionally duplicated (not inherited) so each file is self-contained and
# independently tunable — keep them in sync by convention, not by code.
logging:
  episode:
    # 5000 eps ~= 3-4% of a run; first point lands ~16 min in (measured, see the doc).
    # Keep equal to recurrent_ppo.yaml's value for cross-algo comparability.
    smoothing_episodes: 5000
    # PER-ALGO (row volume). Dreamer runs ~131k eps/24h -> ~655 rows/24h.
    # 200 < smoothing (5000) -> rolling windows overlap.
    interval_episodes: 200
  step:
    # PER-ALGO. Losses are never cross-compared between algorithms, so no
    # universality rule. 200 iters = 25600 env-steps of loss averaging at num_envs=128.
    smoothing_iters: 200
    # < smoothing -> overlapping rolling windows.
    interval_iters: 100
