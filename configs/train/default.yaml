# Default Training Configuration — the REFERENCE / documentation file.
#
# This file documents EVERY available training/logging field, with a generic default
# value for each, so someone can read this one file and know what knobs exist. It is
# also the FALLBACK layer for algorithms that load neither per-algo override file
# (DQN/DRQN/PPO).
#
# rPPO and Dreamer OVERRIDE these values in their own self-contained per-algo files,
# merged ABOVE this file by their own trainer — those files are AUTHORITATIVE for their
# algorithm, not this one:
#   configs/train/recurrent_ppo.yaml  <- train.py (gated on agent.algorithm)
#   configs/train/dreamer_srl.yaml    <- src/algorithms/dreamer_srl/dreamer_srl_main.py
# See docs/develop/active/refactors/DREAMER_TRAIN_CONFIG_SPLIT.md for the design history
# (an earlier revision of this split structurally enforced a shared smoothing_episodes by
# omitting it from both per-algo files; that enforcement was intentionally reversed —
# values ARE now duplicated between this file and the two algo files on purpose, so each
# file is independently readable and tunable).
#
# Config-owns-values convention: num_envs, seed, and checkpoint_frequency are
# CONFIG-OWNED — standard launches must NOT pass --num-envs / --seed /
# --checkpoint-frequency on the CLI; this file and the per-algo layer above it
# are authoritative. A CLI flag for one of these is only ever an intentional,
# flagged-to-the-user deviation, never copied boilerplate. `episodes` is the
# opposite: it is passed explicitly per run (see note below) because the real
# budget genuinely varies by run (smoke=100 / standard=10M / extended=100M).
training:
  episodes: 100  # smoke-test safety placeholder only — real runs always pass --episodes explicitly
  # FALLBACK FOR NON-rPPO/DREAMER ALGORITHMS. train.py:496 reads this via
  # `args.num_envs or config.get_mandatory('training.num_envs')` — that line is SHARED
  # across rPPO/DQN/DRQN/PPO and runs before the algo branches, so DQN/DRQN/PPO (which
  # never load configs/train/recurrent_ppo.yaml) would raise a get_mandatory ValueError
  # without this key. rPPO overrides to num_envs: 128 in recurrent_ppo.yaml (same value,
  # declared for self-containment) and Dreamer overrides to num_envs: 16 in
  # dreamer_srl.yaml — both win over this fallback for their own runs.
  num_envs: 128
  # FALLBACK FOR NON-rPPO/DREAMER ALGORITHMS. train.py:2071 reads this via
  # `args.checkpoint_frequency or config.get_mandatory('training.checkpoint_frequency')`
  # on the shared (non-algo-gated) checkpoint-logic path, so DQN/DRQN/PPO (which never
  # load configs/train/recurrent_ppo.yaml) would raise a get_mandatory ValueError without
  # this key. rPPO overrides to 200000 in recurrent_ppo.yaml and Dreamer overrides to
  # 10000 in dreamer_srl.yaml — both win over this fallback for their own runs.
  checkpoint_frequency: 10000
  # FALLBACK FOR NON-rPPO/DREAMER ALGORITHMS. train.py:628 reads this via
  # `config.get('training.max_checkpoints_to_keep', _missing)` then raises the same
  # Strict-Config ValueError if missing, on the same shared path as checkpoint_frequency
  # above. rPPO overrides to null (keep all checkpoints) in recurrent_ppo.yaml and
  # Dreamer overrides to 20 in dreamer_srl.yaml — both win over this fallback.
  max_checkpoints_to_keep: 20
  video_during_training: true
  stats_during_training: false
  auto_analysis: false
  # --- Async checkpoint-video render (dispatch/poll/drain, src/utils/async_render.py;
  # docs/develop/active/refactors/ASYNC_CHECKPOINT_VIDEO_RENDER.md) ---
  # true  -> the checkpoint MP4 render runs as a non-blocking CPU subprocess; the trainer
  #          polls once per iteration and uploads the finished MP4 from the parent.
  # false -> legacy BLOCKING subprocess.run render inline in the training loop (the
  #          kill-switch, and the pre-plan behavior).
  # FALLBACK FOR NON-rPPO/DREAMER ALGORITHMS: false preserves the pre-plan blocking
  # behavior for DQN/DRQN/PPO. rPPO and Dreamer override to true in their own files.
  async_video_render: false
  # Render the MP4 only every Nth checkpoint (1 = every checkpoint, today's cadence).
  # Applies to the ASYNC path only; recordings + checkpoints are still written at EVERY
  # checkpoint regardless (a skipped MP4 is offline-recoverable from its recordings via
  # scripts/eval/render_recordings.py).
  render_every_n_checkpoints: 1
  # --workers for the render subprocess. null = renderer's own default (cpu_count - 1).
  # NOTE: render_recordings.py parallelises per EPISODE (one task per .rec.gz), so with
  # eval_video_episodes: 3 at most 3 workers ever do work — this knob is a cap, not a
  # contention lever. Read via .get (null is a legitimate declared value).
  render_workers: null
  eval_video_episodes: 3
  eval_stats_episodes: 100
  eval_stats_num_envs: 10
  seed: 42
  device: "auto"
  # DEPRECATED — kept as the backward-compatible fallback for a config that declares NO
  # `logging:` block at all. Since this file DOES declare one (below), any config that
  # merges this file also gets a `logging:` block and takes the two-level path, not this
  # legacy one. See docs/develop/active/refactors/TWO_LEVEL_LOGGING_REDESIGN.md
  log_interval: 10
  log_accumulate: true
episodes: 100  # smoke-test safety placeholder only — real runs always pass --episodes explicitly
seed: 42
tag: "default"

# Two-level logging — the REFERENCE default for all four knobs. rPPO and Dreamer each
# override this COMPLETE block in their own per-algo file (configs/train/recurrent_ppo.yaml,
# configs/train/dreamer_srl.yaml) so those files are self-contained and independently
# tunable; the values below are what DQN/DRQN/PPO actually use (they load neither algo
# file) and what a reader sees as "the generic default" for each knob.
# Every knob names its own unit. smoothing = NOISE (how many samples averaged per point);
# interval = VOLUME (how often a row is written). They are independent on purpose.
#
# CONVENTION (not structurally enforced): logging.episode.smoothing_episodes should be
# kept EQUAL across this file and both per-algo files so a Dreamer curve and an rPPO
# curve average the same number of episodes per point and stay visually comparable.
logging:
  episode:
    # 5000 eps ~= 3-4% of a run; first point lands ~16 min in (measured, see the doc).
    smoothing_episodes: 5000
    # Generic default (row volume). rPPO/Dreamer override to their own throughput-tuned value.
    interval_episodes: 200
  step:
    # Generic default. rPPO/Dreamer override to their own throughput-tuned value.
    smoothing_iters: 200
    # < smoothing -> overlapping rolling windows.
    interval_iters: 100
