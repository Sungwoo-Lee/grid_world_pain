[project]
name = "grid_world_pain"
version = "0.1.0"
description = "Gridworld environment with interoceptive satiation dynamics"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "torch>=2.9.1",
    "jax[cuda12]>=0.9.0",
    "jaxlib>=0.9.0",
    "flax>=0.12.3",
    "optax>=0.2.6",
    "orbax-checkpoint>=0.11.32",
    "matplotlib>=3.10.8",
    "PyYAML>=6.0.3",
    "tqdm>=4.67.1",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "h5py>=3.15.1",
    "wandb>=0.24.0",
    "opencv-python>=4.12.0",
    "cairosvg>=2.7.1",
    "Pillow>=10.4.0",
]
requires-python = ">=3.11.14"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
