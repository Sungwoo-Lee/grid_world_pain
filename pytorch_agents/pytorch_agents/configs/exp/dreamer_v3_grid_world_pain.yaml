seed: 42

fabric:
  accelerator: cuda

algo:
  total_steps: 200_000
  per_rank_sequence_length: 64
  cnn_keys:
    encoder: []
    decoder: []
  mlp_keys:
    encoder: [state]
    decoder: [state]
