# @package _global_

defaults:
  - dreamer_v3
  - override /algo: dreamer_v3_XS
  - override /env: grid_world_pain
  - override /logger@metric.logger: wandb
  - _self_

seed: 42

fabric:
  accelerator: cuda

# NEW: parity with JAX-side wandb.config['algorithm']. Drives dashboard
# filtering — JAX rPPO logs algorithm="RecurrentPPO", JAX Dreamer logs
# "DreamerV3", and now sheeprl DreamerV3 logs the same key.
# Carried to WandB run config via fabric.logger.log_hyperparams(cfg) at startup.
agent:
  algorithm: "DreamerV3"

algo:
  total_steps: 200_000
  per_rank_sequence_length: 64
  cnn_keys:
    encoder: []
    decoder: []
  mlp_keys:
    encoder: [state]
    decoder: [state]
